<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Jaben's Tools</title>
    <style>
      :root {
        --paper: #101410;
        --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        color-scheme: dark;
      }

      body {
        margin: 0;
        background-color: var(--paper);
        color: #e3e9e1;
        font: 17px/1.85 var(--mono);
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: flex;
        justify-content: center;
      }

      header > div {
        font: inherit;
        line-height: 22px;
        white-space: pre;
        color: #fff;
        text-shadow:
          0 0 7px #fff,
          0 0 10px #fff,
          0 0 21px #fff,
          0 0 20px #0fa,
          0 0 90px #0fa;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
 _________________________
/ Hello sun, hello trees, \
\ hello busy, buzzy bees. /
 -------------------------
      \   ^__^
       \  (oo)\_______
          (__)\       )\/\
              ||----w |
              ||     ||
      </div>
    </header>
  

</body></html>
